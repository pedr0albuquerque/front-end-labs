<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="plano.css">
  <title>Escolha seu plano</title>
</head>
<body>
  <section>
    <h4>Gratuito</h4>
    <h3><span class="price">R$0</span>/mês</h3>
    <div class="checks">
      <div>
        <input type="checkbox" name="qtd-usuarios">
        <label for="qtd-usuarios">1 usuário</label>
      </div>
      <div>
        <input type="checkbox" name="qtd-contas">
        <label for="qtd-contas">3 contas de design</label>
      </div>
      <div>
        <input type="checkbox" name="suporte">
        <label for="suporte">Suporte por e-mail</label>
      </div>
    </div>
    <button>Escolher plano</button>
  </section>
  
  <section>
    <h4>Elite</h4>
    <h3><span class="price">R$99</span>/mês</h3>
    <div class="checks">
      <div>
        <input type="checkbox" name="qtd-usuarios">
        <label for="qtd-usuarios">5 ilimitados</label>
      </div>
      <div>
        <input type="checkbox" name="qtd-contas">
        <label for="qtd-contas">10 contas de design</label>
      </div>
      <div>
        <input type="checkbox" name="implementacao">
        <label for="implementacao">100 implementacoes</label>
      </div>
      <div>
        <input type="checkbox" name="suporte">
        <label for="suporte">Suporte 24h por dia</label>
      </div>
    </div>
    <button>Escolher plano</button>
  </section>
  <section>
    <h4>Profissional</h4>
    <h3><span class="price">R$49</span>/mês</h3>
    <div class="checks">
      <div>
        <input type="checkbox" name="qtd-usuarios">
        <label for="qtd-usuarios">100 usuários</label>
      </div>
      <div>
        <input type="checkbox" name="qtd-contas">
        <label for="qtd-contas">3 contas de design</label>
      </div>
      <div>
        <input type="checkbox" name="suporte">
        <label for="suporte">Suporte por e-mail</label>
      </div>
    </div>
    <button>Escolher plano</button>
  </section>
</body>
</html>
