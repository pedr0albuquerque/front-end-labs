<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="plano.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Datatype:wght@100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=check_box" />
  <title>Escolha seu plano</title>
</head>
<body>
  <section>
    <h4>Gratuito</h4>
    <h3><span class="price">R$0</span>/mês</h3>
    <div class="checks">
      <div>
        <i class="material-symbols-outlined">
        </i>
        <label for="qtd-usuarios">100 usuários</label>
      </div>
      <div>
        <i class="material-symbols-outlined">
        </i>
        <label for="qtd-contas">3 contas de design</label>
      </div>
      <div>
        <i class="material-symbols-outlined">
        </i>
        <label for="suporte">Suporte por e-mail</label>
      </div>
    </div>
    <button>Escolher plano</button>
  </section>
  
  <section>
    <h4>Elite</h4>
    <h3><span class="price">R$99</span>/mês</h3>
    <div class="checks">
      <div>
        <i class="material-symbols-outlined">
        </i>
        <label for="qtd-usuarios">5 ilimitados</label>
      </div>
      <div>
        <i class="material-symbols-outlined">
          check_box
        </i>
        <label for="qtd-contas">10 contas de design</label>
      </div>
      <div>
        <i class="material-symbols-outlined">
          check_box
        </i>
        <label for="implementacao">100 implementacoes</label>
      </div>
      <div>
        <i class="material-symbols-outlined">
          check_box
        </i>
        <label for="suporte">Suporte 24h por dia</label>
      </div>
    </div>
    <button>Escolher plano</button>
  </section>
  <section>
    <h4>Profissional</h4>
    <h3><span class="price">R$49</span>/mês</h3>
    <div class="checks">
      <div>
        <i class="material-symbols-outlined">
          check_box
        </i>
        <label for="qtd-usuarios">100 usuários</label>
      </div>
      <div>
        <i class="material-symbols-outlined">
          check_box
        </i>
        <label for="qtd-contas">3 contas de design</label>
      </div>
      <div>
        <i class="material-symbols-outlined">
          check_box
        </i>
        <label for="suporte">Suporte por e-mail</label>
      </div>
    </div>
    <button>Escolher plano</button>
  </section>
</body>
</html>
